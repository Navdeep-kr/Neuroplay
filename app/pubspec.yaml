name: neuroplay
description: NEUROPLAY — Cross-platform brain-training application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.9.0

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

  # Cognitive Game Engine
  game_engine:
    path: ../packages/game_engine

  # Utilities
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  generate: true
