<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEUROPLAY — Science-informed, engaging cognitive training with personalized daily workouts and transparent tracking.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- Open Graph / Social Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NEUROPLAY — Cognitive Training">
  <meta property="og:description" content="Engaging cognitive training workouts designed with adaptive difficulty and transparent personal progress tracking.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEUROPLAY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NEUROPLAY — Cognitive Training</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #FFFFFF; margin: 0; padding: 0;">
  <div id="app-loading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; background-color: #FFFFFF;">
    <div style="width: 44px; height: 44px; border: 4px solid #EFF6FF; border-top: 4px solid #2563EB; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <div style="margin-top: 16px; font-size: 15px; font-weight: 700; color: #0F172A; letter-spacing: 0.5px;">NEUROPLAY</div>
    <div style="margin-top: 4px; font-size: 12px; color: #64748B;">Loading cognitive training engine...</div>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('app-loading');
      if (loader) loader.remove();
    });
  </script>
  <script>
    window.__neuroplayAudio = {
      ctx: null,
      init: function() {
        try {
          if (!this.ctx) {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch(e) {}
      },
      playTone: function(freq, duration, type, startGain) {
        this.init();
        if (!this.ctx) return;
        try {
          var osc = this.ctx.createOscillator();
          var gain = this.ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(startGain || 0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      playChord: function(freqs, duration) {
        var self = this;
        freqs.forEach(function(f, idx) {
          setTimeout(function() {
            self.playTone(f, duration, 'triangle', 0.12);
          }, idx * 70);
        });
      }
    };
    window.addEventListener('pointerdown', function() {
      if (window.__neuroplayAudio) window.__neuroplayAudio.init();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
